[package]
name = "gnnuhub-api"
description = "赣南师范大学教务系统 API 客户端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# 透传 OCR 的 tesseract 引擎开关，方便 workspace 顶层一次性启用：
# `cargo test --features tesseract`
tesseract = ["gnnuhub-ocr/tesseract"]

# `ocr_bench` 直接用了 `gnnuhub_ocr::TesseractOcr`，只有在启用 tesseract
# 时才能编译。用 `required-features` 声明依赖，这样默认 feature 下
# `cargo test` 不会因为它而失败。
#
# 注意 `ocr_verify` **没有**这个限制：它默认走位图查表，tesseract 只是
# `#[cfg]` 掉的可选对照，所以默认构建下也能跑。
[[example]]
name = "ocr_bench"
required-features = ["tesseract"]

[dependencies]
gnnuhub-core.workspace = true
gnnuhub-crypto.workspace = true
gnnuhub-ocr.workspace = true

reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
scraper.workspace = true
url.workspace = true

[dev-dependencies]
anyhow.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
gnnuhub-crypto.workspace = true
gnnuhub-ocr.workspace = true
