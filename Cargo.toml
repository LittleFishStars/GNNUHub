[workspace]
resolver = "2"
members = [
    "crates/gnnuhub-core",
    "crates/gnnuhub-crypto",
    "crates/gnnuhub-ocr",
    "crates/gnnuhub-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["LittleFishStars"]
repository = "https://github.com/LittleFishStars/GNNUHub"
description = "赣南师范大学教务系统接口与客户端"

[workspace.dependencies]
# 内部 crate
gnnuhub-core = { path = "crates/gnnuhub-core" }
gnnuhub-crypto = { path = "crates/gnnuhub-crypto" }
gnnuhub-ocr = { path = "crates/gnnuhub-ocr" }
gnnuhub-api = { path = "crates/gnnuhub-api" }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时与 HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "cookies",
    "gzip",
] }

# 大数运算（RSA）
num-bigint = "0.4"
num-traits = "0.2"

# 图像处理（验证码）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# HTML 解析（教务系统返回的是 HTML 页面）
scraper = "0.23"

# URL 处理
url = "2"

# 错误处理
thiserror = "2"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 随机数
rand = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
